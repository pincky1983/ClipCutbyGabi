<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipCut by Gabi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h2>ClipCut by Gabi</h2>
            <select id="langSelect">
                <option value="ro">🇷🇴 RO</option>
                <option value="es">🇪🇸 ES</option>
                <option value="en">🇬🇧 EN</option>
            </select>
        </div>
        <div class="tabs-bar">
            <button type="button" class="tab-btn active" data-tab="tabCut" data-i18n="tabCut">✂️ Taie</button>
            <button type="button" class="tab-btn" data-tab="tabMerge" data-i18n="tabMerge">🔗 Lipește</button>
            <button type="button" class="tab-btn" data-tab="tabExtract" data-i18n="tabExtract">🎵 MP3</button>
            <button type="button" class="tab-btn" data-tab="tabMux" data-i18n="tabMux">🎬 V+A</button>
                        <button type="button" class="tab-btn" data-tab="tabSlide" data-i18n="tabSlide">🖼️ Slide</button>
                        <button type="button" class="tab-btn" data-tab="tabKaraoke" data-i18n="tabKaraoke">🎤 Karaoke</button>
        </div>
        <!-- TAB 1: TAIE -->
        <div id="tabCut" class="tab-panel active">
            <div class="card">
                <label for="fileInput" class="btn-upload" data-i18n="chooseFile">1. Alege MP3 sau MP4</label>
                <input type="file" id="fileInput" accept="video/*,audio/*,.mp4,.mp3">
                <p id="fileName" data-i18n="noFile">Niciun fișier selectat</p>
                <video id="mediaPlayer" controls style="display:none;"></video>
            </div>
            <div class="card">
                <label data-i18n="intervalLabel">2. Interval (secunde sau HH:MM:SS)</label>
                <div class="time-row">
                    <input type="text" id="startTime" value="00:00:00">
                    <button type="button" class="btn-small" id="setStartBtn" data-i18n="getTime">Ia timp curent</button>
                </div>
                <div class="time-row">
                    <input type="text" id="endTime" value="00:00:10">
                    <button type="button" class="btn-small" id="setEndBtn" data-i18n="getTime">Ia timp curent</button>
                </div>
            </div>
            <div class="card">
                <label data-i18n="outputNameLabel">Nume fișier nou (fără extensie)</label>
                <input type="text" id="outputNameInput" placeholder="ex: clip_taiat">
            </div>
            <button id="cutBtn" disabled data-i18n="cutSave">3. Taie și Salvează</button>
        </div>

        <!-- TAB 2: LIPESTE -->
        <div id="tabMerge" class="tab-panel">
            <div class="card">
                <label for="mergeFile1" class="btn-upload" data-i18n="choosePart1">1. Alege Partea 1 (MP4/MP3)</label>
                <input type="file" id="mergeFile1" accept="video/*,audio/*,.mp4,.mp3">
                <p id="mergeName1" style="text-align:center; font-size:13px; color:#8b949e; margin-top:8px;" data-i18n="noFile">Niciun fișier selectat</p>
            </div>
            <div class="card">
                <label for="mergeFile2" class="btn-upload" data-i18n="choosePart2">2. Alege Partea 2 (același format)</label>
                <input type="file" id="mergeFile2" accept="video/*,audio/*,.mp4,.mp3">
                <p id="mergeName2" style="text-align:center; font-size:13px; color:#8b949e; margin-top:8px;" data-i18n="noFile">Niciun fișier selectat</p>
            </div>
            <div class="card">
                <label data-i18n="outputNameLabel">Nume fișier nou (fără extensie)</label>
                <input type="text" id="mergeOutputName" value="clip_unit">
            </div>
            <button id="mergeBtn" style="width:100%; padding:16px; background:linear-gradient(135deg,#238636,#2ea043); color:#fff; border:none; border-radius:14px; font-size:16px; font-weight:700;" data-i18n="mergeSave">🔗 Lipește și Salvează</button>
        </div>

        <!-- TAB 3: EXTRAGE MP3 -->
        <div id="tabExtract" class="tab-panel">
            <div class="card">
                <label for="extractFile" class="btn-upload" data-i18n="chooseVideo">1. Alege Video (MP4)</label>
                <input type="file" id="extractFile" accept="video/*,.mp4">
                <p id="extractName" style="text-align:center; font-size:13px; color:#8b949e; margin-top:8px;" data-i18n="noFile">Niciun fișier selectat</p>
            </div>
            <div class="card">
                <label data-i18n="outputNameLabel">Nume fișier MP3 (fără extensie)</label>
                <input type="text" id="extractOutputName" value="audio_extras">
            </div>
            <button id="extractBtn" style="width:100%; padding:16px; background:linear-gradient(135deg,#238636,#2ea043); color:#fff; border:none; border-radius:14px; font-size:16px; font-weight:700;" data-i18n="extractSave">🎵 Extrage MP3 și Salvează</button>
        </div>

        <!-- TAB 4: VIDEO + AUDIO -->
        <div id="tabMux" class="tab-panel">
            <div class="card">
                <label for="muxVideoFile" class="btn-upload" data-i18n="chooseVideo">1. Alege Video (MP4)</label>
                <input type="file" id="muxVideoFile" accept="video/*,.mp4">
                <p id="muxVideoName" style="text-align:center; font-size:13px; color:#8b949e; margin-top:8px;" data-i18n="noFile">Niciun fișier selectat</p>
            </div>
            <div class="card">
                <label for="muxAudioFile" class="btn-upload" data-i18n="chooseAudio">2. Alege Sunet Nou (MP3)</label>
                <input type="file" id="muxAudioFile" accept="audio/*,.mp3">
                <p id="muxAudioName" style="text-align:center; font-size:13px; color:#8b949e; margin-top:8px;" data-i18n="noFile">Niciun fișier selectat</p>
            </div>
            <div class="card">
                <label data-i18n="outputNameLabel">Nume fișier nou (fără extensie)</label>
                <input type="text" id="muxOutputName" value="video_nou">
            </div>
            <button id="muxBtn" style="width:100%; padding:16px; background:linear-gradient(135deg,#238636,#2ea043); color:#fff; border:none; border-radius:14px; font-size:16px; font-weight:700;" data-i18n="muxSave">🎬 Combină și Salvează</button>
        </div>
                <!-- TAB 5: SLIDESHOW FOTO + MP3 -->
        <div id="tabSlide" class="tab-panel">
            <div class="card">
                <label for="slideImages" class="btn-upload" data-i18n="choosePhotos">1. Alege Poze (JPG / PNG)</label>
                <input type="file" id="slideImages" accept="image/*" multiple>
                <p id="slideImagesName" style="text-align:center; font-size:13px; color:#8b949e; margin-top:8px;" data-i18n="noFile">Niciun fișier selectat</p>
            </div>
            <div class="card">
                <label for="slideAudio" class="btn-upload" data-i18n="chooseAudioOpt">2. Alege Muzică MP3 (opțional)</label>
                <input type="file" id="slideAudio" accept="audio/*,.mp3">
                <p id="slideAudioName" style="text-align:center; font-size:13px; color:#8b949e; margin-top:8px;" data-i18n="noFile">Niciun fișier selectat</p>
            </div>
            <div class="card">
                <label data-i18n="secPerPhoto">Secunde per poză & Nume fișier</label>
                <div class="time-row">
                    <input type="text" id="slideDuration" value="3" style="max-width:75px;">
                    <input type="text" id="slideOutputName" value="colaj_foto">
                </div>
            </div>
            <button id="slideBtn" style="width:100%; padding:16px; background:linear-gradient(135deg,#238636,#2ea043); color:#fff; border:none; border-radius:14px; font-size:16px; font-weight:700;" data-i18n="slideSave">🖼️ Creează Video Animat</button>
        </div>
                <!-- TAB 6: KARAOKE VERSURI SINCRONIZATE -->
        <div id="tabKaraoke" class="tab-panel">
            <div class="card">
                <label for="karaokeAudio" class="btn-upload" data-i18n="chooseKaraokeAudio">1. Alege Melodia (MP3 / M4A)</label>
                <input type="file" id="karaokeAudio" accept="audio/*,.mp3,.m4a">
                <p id="karaokeAudioName" style="text-align:center; font-size:13px; color:#8b949e; margin-top:8px;" data-i18n="noFile">Niciun fișier selectat</p>
                <audio id="karaokePlayer" controls style="width:100%; margin-top:12px; display:none;"></audio>
            </div>
            <div class="card">
                <label for="karaokeBg" class="btn-upload" style="background:linear-gradient(135deg,#21262d,#30363d); box-shadow:none; border:1px solid rgba(255,255,255,0.15);" data-i18n="chooseKaraokeBg">2. Poză Fundal (opțional)</label>
                <input type="file" id="karaokeBg" accept="image/*">
                <p id="karaokeBgName" style="text-align:center; font-size:13px; color:#8b949e; margin-top:8px;" data-i18n="defaultBg">Fundal negru implicit</p>
            </div>
            <div class="card">
                <label data-i18n="karaokeLyricsLabel">3. Versuri ([STROFA] / [REFREN])</label>
                <button type="button" id="karaokeTapBtn" style="width:100%; padding:12px; margin-bottom:10px; background:linear-gradient(135deg,#d97706,#f59e0b); color:#fff; border:none; border-radius:10px; font-size:14px; font-weight:700;" data-i18n="tapPauseTime">⏸️ Oprește Melodia & Inserează Timp</button>
                <textarea id="karaokeLyrics" rows="8" placeholder="[STROFA]&#10;00:05 Primul vers&#10;00:09 Al doilea vers&#10;&#10;[REFREN]&#10;00:14 Refren vers 1&#10;00:18 Refren vers 2&#10;&#10;[STROFA]&#10;Vers strofa 2 (fara timp)&#10;Al doilea vers (fara timp)" style="width:100%; padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,0.12); background:#0d1117; color:#f0f6fc; font-size:14px; line-height:1.5; resize:vertical;"></textarea>
            </div>
            <div class="card">
                <label data-i18n="outputNameLabel">Nume fișier nou (fără extensie)</label>
                <input type="text" id="karaokeOutputName" value="karaoke_video">
            </div>
            <button id="karaokeBtn" style="width:100%; padding:16px; background:linear-gradient(135deg,#238636,#2ea043); color:#fff; border:none; border-radius:14px; font-size:16px; font-weight:700;" data-i18n="karaokeSave">🎤 Creează Video Karaoke</button>
        </div>

        <button type="button" id="changeFolderBtn" class="btn-small" style="width:100%; margin-top:10px; padding:12px;" data-i18n="changeFolder">
            📁 Schimbă folderul de salvare
        </button>
                <div class="status-wrapper">
            <div id="progressFill" class="progress-fill"></div>
            <div id="statusBox" class="status-text" data-i18n="waiting">Așteptare fișier...</div>
        </div>
        <div id="eqVisualizer" class="equalizer">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
        </div>
    </div>
    <script src="lang.js"></script>
    <script src="app.js"></script>
</body>
</html>
